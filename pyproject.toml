[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "padel-analysis"
version = "0.1.0"
description = "Automatic analysis of padel matches from broadcast video"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "scipy>=1.12",
    "ultralytics>=8.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
eval = ["supervision>=0.25,<0.31", "motmetrics>=1.4"]

[project.scripts]
padel-analysis = "padel_analysis.cli:main"
padel-analyse = "padel_analysis.analyse:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
padel_analysis = ["render/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "padel-analysis"
version = "0.1.0"
description = "Automatic analysis of padel matches from broadcast video"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "scipy>=1.12",
    "ultralytics>=8.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "pylint>=3.2"]
eval = ["supervision>=0.25,<0.31", "motmetrics>=1.4"]

[project.scripts]
padel-analysis = "padel_analysis.cli:main"
padel-analyse = "padel_analysis.analyse:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.pylint.main]
# OpenCV est une extension compilee : sans cela, chaque appel a cv2 passe pour une erreur.
extension-pkg-allow-list = ["cv2"]
# Les scripts s'importent entre eux par leur nom, comme lances depuis scripts/.
init-hook = "import sys; sys.path.append('scripts')"

[tool.pylint.typecheck]
generated-members = ["cv2.*"]

[tool.pylint.format]
max-line-length = 100

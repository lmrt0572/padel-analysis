<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #0e1117; --panel: #161b22; --line: #2a313c; --text: #e8eaed; --muted: #8b95a5;
    --sol: #3ddc97; --verre: #4cc9f0; --grillage: #adb5bd; --filet: #ff6b6b;
    --near_1: #ffd166; --near_2: #f4845f; --far_1: #9d7bea; --far_2: #f15bb5;
    --ok: #3ddc97; --warn: #f4a259; --bad: #ff5d5d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center;
           padding: 12px 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
  header h1 span { color: var(--muted); font-weight: 400; }
  select { max-width: 100%; }
  select, button { background: var(--panel); color: var(--text); border: 1px solid var(--line);
                   border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--ok); color: var(--ok); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .toggles { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); }
  .toggles label { cursor: pointer; user-select: none; }
  main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(280px, 2fr); gap: 14px;
         padding: 14px 20px; }
  .left, .right { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
           padding: 12px 14px; }
  .panel h2 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; color: var(--muted);
              letter-spacing: .08em; display: flex; justify-content: space-between; }
  .panel h2 .info { cursor: help; border: 1px solid var(--line); border-radius: 50%;
                    width: 17px; height: 17px; display: inline-grid; place-items: center;
                    font-size: 11px; text-transform: none; }
  .hidden { display: none !important; }
  video { width: 100%; border-radius: 10px; background: #000; display: block; }
  svg { display: block; width: 100%; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
  .keys b { display: block; font-size: 26px; font-weight: 600; }
  .keys span { color: var(--muted); font-size: 12px; }
  .row { display: grid; grid-template-columns: 90px 1fr 44px; gap: 8px; align-items: center;
         margin: 6px 0; }
  .row .bar { display: flex; height: 14px; border-radius: 4px; overflow: hidden;
              background: var(--line); }
  .row .num { text-align: right; font-variant-numeric: tabular-nums; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: 12px;
            margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
              margin-right: 4px; vertical-align: -1px; }
  .truth-summary { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 6px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Padel Analysis <span>— statistiques d'un échange</span></h1>
  <select id="rally" aria-label="Échange"></select>
  <button id="truth" aria-pressed="false"
          title="Comparer la détection au pointage fait à la main">Mode vérité</button>
  <div class="toggles" id="toggles"></div>
</header>
<main>
  <div class="left">
    <video id="video" controls muted playsinline></video>
    <section class="panel" data-panel="frise">
      <h2>Chronologie des contacts <span class="info">i</span></h2>
      <svg id="timeline" viewBox="0 0 1000 110" preserveAspectRatio="none"></svg>
      <div class="legend" id="kind-legend"></div>
      <div class="truth-summary" id="truth-summary"></div>
    </section>
  </div>
  <div class="right">
    <section class="panel" data-panel="plan">
      <h2>Plan du court <span class="info">i</span></h2>
      <svg id="court" viewBox="-6.5 -11.5 13 23" style="max-height:440px"></svg>
      <div class="note">Vu de dessus, la caméra en bas. Les impacts à venir sont estompés.</div>
    </section>
    <section class="panel" data-panel="chiffres">
      <h2>Chiffres clés <span class="info">i</span></h2>
      <div class="keys" id="keys"></div>
    </section>
    <section class="panel" data-panel="frappes">
      <h2>Qui frappe quoi <span class="info">i</span></h2>
      <div id="shots"></div>
      <div class="legend" id="after-legend"></div>
    </section>
    <section class="panel" data-panel="vitesse">
      <h2>Vitesse de la balle <span class="info">i</span></h2>
      <svg id="speed" viewBox="0 0 400 140"></svg>
    </section>
    <section class="panel" data-panel="deplacements">
      <h2>Déplacements <span class="info">i</span></h2>
      <div id="moves"></div>
    </section>
  </div>
</main>
<script>
const DATA = {{DATA}};
</script>
<script>
(() => {
  const SVG = "http://www.w3.org/2000/svg";
  const PANELS = { frise: "Chronologie", plan: "Plan", chiffres: "Chiffres",
                   frappes: "Frappes", vitesse: "Vitesse", deplacements: "Déplacements" };
  const KIND_NAMES = { raquette: "frappe", sol: "sol", verre: "vitre", grillage: "grillage",
                       filet: "filet", fin: "rien ensuite" };
  const STATUS = { "juste": "var(--ok)", "surface fausse": "var(--warn)",
                   "invente": "var(--bad)", "manque": "var(--bad)" };
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const kindColour = kind => css("--" + kind) || css("--muted");
  const playerColour = slot => css("--" + slot) || css("--text");
  const fr = (value, digits = 0) => value.toLocaleString("fr-FR",
    { minimumFractionDigits: digits, maximumFractionDigits: digits });
  const el = (tag, attrs = {}, parent = null) => {
    const node = document.createElementNS(SVG, tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    if (parent) parent.appendChild(node);
    return node;
  };

  const video = document.getElementById("video");
  const select = document.getElementById("rally");
  const truthButton = document.getElementById("truth");
  let rally = null;
  let truthMode = false;

  // Choix des panneaux, retenu d'une visite a l'autre quand le navigateur le permet.
  const STORE = "padel-rally-panels";
  let shown = {};
  try { shown = JSON.parse(localStorage.getItem(STORE) || "{}"); } catch (e) { shown = {}; }
  const toggles = document.getElementById("toggles");
  for (const [key, label] of Object.entries(PANELS)) {
    const box = document.createElement("label");
    const input = document.createElement("input");
    input.type = "checkbox";
    input.checked = shown[key] !== false;
    input.dataset.panel = key;
    input.addEventListener("change", () => {
      shown[key] = input.checked;
      try { localStorage.setItem(STORE, JSON.stringify(shown)); } catch (e) { /* prive */ }
      applyToggles();
    });
    box.append(input, " " + label);
    toggles.appendChild(box);
  }
  function applyToggles() {
    for (const section of document.querySelectorAll("section.panel")) {
      section.classList.toggle("hidden", shown[section.dataset.panel] === false);
    }
  }
  for (const section of document.querySelectorAll("section.panel")) {
    section.querySelector(".info").title = DATA.reliability[section.dataset.panel] || "";
  }

  DATA.rallies.forEach((r, i) => {
    const option = document.createElement("option");
    option.value = i;
    option.textContent = r.title;
    select.appendChild(option);
  });
  select.addEventListener("change", () => load(DATA.rallies[+select.value]));
  truthButton.addEventListener("click", () => {
    truthMode = !truthMode;
    truthButton.setAttribute("aria-pressed", truthMode);
    drawTimeline();
  });

  function seek(t) {
    video.currentTime = Math.max(0, t - 0.4);
    video.play().catch(() => {});
  }

  // ---------------------------------------------------------------- frise
  function drawTimeline() {
    const svg = document.getElementById("timeline");
    svg.replaceChildren();
    const x = t => 20 + (t / rally.duration) * 960;
    el("line", { x1: 20, x2: 980, y1: 36, y2: 36, stroke: css("--line"), "stroke-width": 2 }, svg);
    for (let s = 0; s <= rally.duration; s += 5) {
      el("line", { x1: x(s), x2: x(s), y1: 30, y2: 42, stroke: css("--line") }, svg);
      const label = el("text", { x: x(s), y: 58, fill: css("--muted"), "font-size": 11,
                                  "text-anchor": "middle" }, svg);
      label.textContent = s + " s";
    }
    const status = new Map();
    if (truthMode && rally.truth) {
      for (const line of rally.truth) {
        if (line.t_detected !== null) status.set(line.t_detected, line.status);
      }
    }
    for (const c of rally.contacts) {
      const colour = c.kind === "raquette" ? playerColour(c.player) : kindColour(c.kind);
      const group = el("g", { style: "cursor:pointer" }, svg);
      const ring = status.get(c.t);
      el("circle", { cx: x(c.t), cy: 36, r: 9, fill: colour,
                     stroke: ring ? STATUS[ring] : css("--bg"), "stroke-width": ring ? 3 : 2 },
         group);
      if (c.kind === "raquette" && c.player) {
        const letter = el("text", { x: x(c.t), y: 40, "text-anchor": "middle", "font-size": 10,
                                    "font-weight": 700, fill: css("--bg") }, group);
        letter.textContent = (rally.players[c.player]?.name || c.player).slice(0, 1);
      }
      const tip = el("title", {}, group);
      tip.textContent = `${fr(c.t, 1)} s — ${KIND_NAMES[c.kind]}` +
        (c.player ? ` de ${rally.players[c.player]?.name || c.player}` : "") +
        (ring ? ` (${ring})` : "");
      group.addEventListener("click", () => seek(c.t));
    }
    const summary = document.getElementById("truth-summary");
    summary.textContent = "";
    if (truthMode && rally.truth) {
      const label = el("text", { x: 20, y: 80, fill: css("--muted"), "font-size": 11 }, svg);
      label.textContent = "Pointage à la main";
      for (const line of rally.truth) {
        if (line.t_marked === null) continue;
        const group = el("g", { style: "cursor:pointer" }, svg);
        el("rect", { x: x(line.t_marked) - 6, y: 88, width: 12, height: 12, rx: 2,
                     fill: kindColour(line.marked), stroke: STATUS[line.status],
                     "stroke-width": 2.5 }, group);
        const tip = el("title", {}, group);
        tip.textContent = `${fr(line.t_marked, 1)} s — ${KIND_NAMES[line.marked]} (${line.status})`;
        group.addEventListener("click", () => seek(line.t_marked));
      }
      const count = s => rally.truth.filter(l => l.status === s).length;
      const marked = rally.truth.filter(l => l.t_marked !== null).length;
      summary.textContent = `Sur ${marked} contacts pointés : ${count("juste")} justes, ` +
        `${count("surface fausse")} de surface fausse, ${count("manque")} manqués ; ` +
        `${count("invente")} contacts inventés. Cercle vert : juste, orange : surface ` +
        `fausse, rouge : inventé ou manqué.`;
    } else if (truthMode) {
      summary.textContent = "Cet échange n'a pas été pointé à la main.";
    }
    el("line", { id: "cursor", x1: 20, x2: 20, y1: 18, y2: 104, stroke: css("--text"),
                 "stroke-width": 1.5 }, svg);
  }

  // ---------------------------------------------------------------- plan
  const HALF_W = 5, HALF_L = 10, SERVICE = 6.95;
  function drawCourt() {
    const svg = document.getElementById("court");
    svg.replaceChildren();
    const line = { stroke: "#3ddc9766", "stroke-width": 0.07, fill: "none" };
    el("rect", { x: -HALF_W, y: -HALF_L, width: 2 * HALF_W, height: 2 * HALF_L,
                 fill: "#123a2a", stroke: css("--sol"), "stroke-width": 0.1 }, svg);
    for (const s of [-SERVICE, SERVICE]) el("line", { x1: -HALF_W, x2: HALF_W, y1: s, y2: s, ...line }, svg);
    el("line", { x1: 0, x2: 0, y1: -SERVICE, y2: SERVICE, ...line }, svg);
    el("line", { x1: -HALF_W - .3, x2: HALF_W + .3, y1: 0, y2: 0, stroke: css("--text"),
                 "stroke-width": 0.12 }, svg);
    // Le plan est dessine camera en bas : y du court vers le haut de l'image.
    for (const [slot, player] of Object.entries(rally.players)) {
      if (!player.path.length) continue;
      // Une trace coupee (null) aux sauts du suivi : un trait par morceau.
      let piece = [];
      for (const p of [...player.path, null]) {
        if (p) { piece.push(`${p[1]},${-p[2]}`); continue; }
        if (piece.length > 1) {
          el("polyline", { points: piece.join(" "), fill: "none", stroke: playerColour(slot),
                           "stroke-width": 0.08, "stroke-opacity": 0.45 }, svg);
        }
        piece = [];
      }
      el("circle", { id: "dot-" + slot, r: 0.35, fill: playerColour(slot),
                     stroke: css("--bg"), "stroke-width": 0.08 }, svg);
    }
    for (const [i, impact] of rally.impacts.entries()) {
      const [px, py, pz] = impact.point;
      const group = el("g", { class: "impact", "data-t": impact.t, style: "cursor:pointer" }, svg);
      if (impact.kind === "sol") {
        el("circle", { cx: px, cy: -py, r: 0.28, fill: kindColour("sol"),
                       stroke: css("--bg"), "stroke-width": 0.06 }, group);
      } else {
        // Un mur se voit de dessus comme un trait : le point y est pose sur le bord.
        const onBack = Math.abs(py) > HALF_L - 0.3;
        const x = onBack ? px : Math.sign(px) * HALF_W;
        const y = onBack ? Math.sign(py) * HALF_L : py;
        el("rect", { x: x - 0.3, y: -y - 0.3, width: 0.6, height: 0.6, rx: 0.1,
                     fill: kindColour(impact.kind), transform: `rotate(45 ${x} ${-y})` }, group);
      }
      const tip = el("title", {}, group);
      tip.textContent = `${fr(impact.t, 1)} s — ${KIND_NAMES[impact.kind]}` +
        (impact.kind !== "sol" ? `, à ${fr(pz, 1)} m de haut` : "");
      group.addEventListener("click", () => seek(impact.t));
    }
  }

  function positionAt(path, t) {
    let best = null;
    for (const p of path) {
      if (!p) continue;
      if (best === null || p[0] <= t) best = p; else break;
    }
    return best;
  }

  // ---------------------------------------------------------------- panneaux
  function drawKeys() {
    const s = rally.summary;
    const cells = [[fr(s.duration, 1) + " s", "durée"], [s.shots, "frappes"],
                   [s.walls, "vitres et grillages"], [KIND_NAMES[s.last] || "—", "dernier contact"]];
    document.getElementById("keys").innerHTML = cells.map(([v, l]) =>
      `<div><b>${v}</b><span>${l}</span></div>`).join("");
  }

  function drawShots() {
    const order = ["sol", "verre", "grillage", "filet", "raquette", "fin"];
    const rows = Object.entries(rally.players).filter(([, p]) => p.shots > 0)
      .sort((a, b) => b[1].shots - a[1].shots);
    document.getElementById("shots").innerHTML = rows.map(([slot, p]) => {
      const parts = order.filter(k => p.after[k]).map(k =>
        `<span title="${p.after[k]} × ${KIND_NAMES[k]}" style="flex:${p.after[k]};` +
        `background:${k === "fin" ? css("--line") : kindColour(k)}"></span>`).join("");
      return `<div class="row"><span style="color:${playerColour(slot)}">${escapeHtml(p.name)}</span>` +
             `<span class="bar">${parts}</span><span class="num">${p.shots}</span></div>`;
    }).join("") || `<div class="note">Aucune frappe détectée.</div>`;
    document.getElementById("after-legend").innerHTML = "Ce que la balle touche ensuite : " +
      ["sol", "verre", "grillage", "filet", "raquette"].map(k =>
        `<span><i style="background:${kindColour(k)}"></i>${KIND_NAMES[k]}</span>`).join("");
  }

  function drawSpeed() {
    const svg = document.getElementById("speed");
    svg.replaceChildren();
    if (!rally.speeds.length) {
      const t = el("text", { x: 10, y: 20, fill: css("--muted"), "font-size": 12 }, svg);
      t.textContent = "Pas de vitesse mesurable sur cet échange.";
      return;
    }
    const top = Math.max(...rally.speeds.map(s => s.kmh), 10);
    const x = t => 30 + (t / rally.duration) * 360;
    const y = v => 120 - (v / top) * 100;
    for (const v of [0, Math.round(top / 2), Math.round(top)]) {
      el("line", { x1: 30, x2: 390, y1: y(v), y2: y(v), stroke: css("--line") }, svg);
      const label = el("text", { x: 26, y: y(v) + 4, fill: css("--muted"), "font-size": 10,
                                 "text-anchor": "end" }, svg);
      label.textContent = v;
    }
    const unit = el("text", { x: 30, y: 136, fill: css("--muted"), "font-size": 10 }, svg);
    unit.textContent = "km/h, moyenne en ligne droite entre deux contacts";
    for (const s of rally.speeds) {
      const bar = el("rect", { x: x(s.t0), y: y(s.kmh), width: Math.max(2, x(s.t1) - x(s.t0) - 1),
                               height: 120 - y(s.kmh), fill: css("--verre"),
                               "fill-opacity": s.estimated ? 0.35 : 0.9,
                               style: "cursor:pointer" }, svg);
      const tip = el("title", {}, bar);
      tip.textContent = `${fr(s.kmh)} km/h` + (s.estimated ? " (estimée : un bout est une frappe)" : "");
      bar.addEventListener("click", () => seek(s.t0));
    }
  }

  function drawMoves() {
    document.getElementById("moves").innerHTML = Object.entries(rally.players)
      .filter(([, p]) => p.distance !== null).map(([slot, p]) =>
        `<div class="row"><span style="color:${playerColour(slot)}">${escapeHtml(p.name)}</span>` +
        `<span class="bar" title="${fr(100 * p.net_share)} % du temps au filet">` +
        `<span style="flex:${p.net_share};background:${playerColour(slot)}"></span>` +
        `<span style="flex:${1 - p.net_share}"></span></span>` +
        `<span class="num">${fr(p.distance, 1)} m</span></div>`).join("") +
      `<div class="note">Barre : part du temps au filet. Nombre : distance parcourue.</div>`;
  }

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;",
      '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ---------------------------------------------------------------- synchronisation
  function tick() {
    if (!rally) return;
    const t = video.currentTime;
    const cursor = document.getElementById("cursor");
    if (cursor) {
      const x = 20 + Math.min(t / rally.duration, 1) * 960;
      cursor.setAttribute("x1", x);
      cursor.setAttribute("x2", x);
    }
    for (const node of document.querySelectorAll("#court .impact")) {
      node.style.opacity = +node.dataset.t <= t + 0.05 ? 1 : 0.15;
    }
    for (const [slot, player] of Object.entries(rally.players)) {
      const dot = document.getElementById("dot-" + slot);
      const p = positionAt(player.path, t);
      if (dot && p) { dot.setAttribute("cx", p[1]); dot.setAttribute("cy", -p[2]); }
    }
    if (!video.paused) requestAnimationFrame(tick);
  }
  video.addEventListener("play", () => requestAnimationFrame(tick));
  video.addEventListener("seeked", tick);
  video.addEventListener("timeupdate", tick);

  function load(r) {
    rally = r;
    video.src = r.video;
    truthButton.disabled = !r.truth;
    if (!r.truth) { truthMode = false; truthButton.setAttribute("aria-pressed", false); }
    document.getElementById("kind-legend").innerHTML =
      ["sol", "verre", "grillage", "filet"].map(k =>
        `<span><i style="background:${kindColour(k)}"></i>${KIND_NAMES[k]}</span>`).join("") +
      Object.entries(r.players).map(([slot, p]) =>
        `<span><i style="background:${playerColour(slot)}"></i>frappe de ${escapeHtml(p.name)}</span>`
      ).join("");
    drawTimeline(); drawCourt(); drawKeys(); drawShots(); drawSpeed(); drawMoves();
    tick();
  }

  applyToggles();
  if (DATA.rallies.length) load(DATA.rallies[0]);
})();
</script>
</body>
</html>
